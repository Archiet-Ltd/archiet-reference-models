<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1075" viewBox="0 0 1130 1075" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"><style>.cap{font-size:9px;fill:#555}</style><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#444"/></marker><marker id="hollow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#fff" stroke="#444"/></marker><marker id="solid" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#444"/></marker></defs><rect width="1130" height="1075" fill="#ffffff"/><rect x="20" y="20" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="46.5" text-anchor="middle" font-weight="400">Article 5: Prohibited AI practices</text><text x="275" y="70" text-anchor="end" class="cap">requirement</text><rect x="20" y="90" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="116.5" text-anchor="middle" font-weight="400">Article 9: Risk management system</text><text x="275" y="140" text-anchor="end" class="cap">requirement</text><rect x="20" y="160" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="186.5" text-anchor="middle" font-weight="400">Article 12: Record-keeping</text><text x="275" y="210" text-anchor="end" class="cap">requirement</text><rect x="20" y="230" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="249.0" text-anchor="middle" font-weight="400">Article 15: Accuracy, robustness</text><text x="150.0" y="264.0" text-anchor="middle" font-weight="400">and cybersecurity</text><text x="275" y="280" text-anchor="end" class="cap">requirement</text><rect x="20" y="300" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="326.5" text-anchor="middle" font-weight="400">Article 72: Post-market monitoring</text><text x="275" y="350" text-anchor="end" class="cap">requirement</text><rect x="20" y="370" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="389.0" text-anchor="middle" font-weight="400">Article 11: Technical</text><text x="150.0" y="404.0" text-anchor="middle" font-weight="400">documentation</text><text x="275" y="420" text-anchor="end" class="cap">requirement</text><rect x="20" y="440" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="459.0" text-anchor="middle" font-weight="400">Article 10: Data and data</text><text x="150.0" y="474.0" text-anchor="middle" font-weight="400">governance</text><text x="275" y="490" text-anchor="end" class="cap">requirement</text><rect x="20" y="510" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="529.0" text-anchor="middle" font-weight="400">Article 13: Transparency and</text><text x="150.0" y="544.0" text-anchor="middle" font-weight="400">information to deployers</text><text x="275" y="560" text-anchor="end" class="cap">requirement</text><rect x="20" y="580" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="599.0" text-anchor="middle" font-weight="400">Article 50: Transparency for</text><text x="150.0" y="614.0" text-anchor="middle" font-weight="400">certain AI systems</text><text x="275" y="630" text-anchor="end" class="cap">requirement</text><rect x="20" y="650" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="669.0" text-anchor="middle" font-weight="400">Article 73: Reporting of serious</text><text x="150.0" y="684.0" text-anchor="middle" font-weight="400">incidents</text><text x="275" y="700" text-anchor="end" class="cap">requirement</text><rect x="20" y="720" width="260" height="55" rx="4" fill="#CCCCFF" stroke="#5c5c5c"/><text x="150.0" y="746.5" text-anchor="middle" font-weight="400">Article 14: Human oversight</text><text x="275" y="770" text-anchor