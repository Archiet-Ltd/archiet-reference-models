xt x="980.0" y="396.5" text-anchor="middle" font-weight="400">A.4 Resources for AI systems</text><text x="1105" y="420" text-anchor="end" class="cap">function</text><rect x="850" y="440" width="260" height="55" rx="4" fill="#FFFFB5" stroke="#5c5c5c"/><text x="980.0" y="466.5" text-anchor="middle" font-weight="400">A.7 Data for AI systems</text><text x="1105" y="490" text-anchor="end" class="cap">function</text><rect x="850" y="580" width="260" height="55" rx="4" fill="#FFFFB5" stroke="#5c5c5c"/><text x="980.0" y="599.0" text-anchor="middle" font-weight="400">A.8 Information for interested</text><text x="980.0" y="614.0" text-anchor="middle" font-weight="400">parties</text><text x="1105" y="630" text-anchor="end" class="cap">function</text><rect x="850" y="720" width="260" height="55" rx="4" fill="#FFFFB5" stroke="#5c5c5c"/><text x="980.0" y="746.5" text-anchor="middle" font-weight="400">A.9 Use of AI systems</text><text x="1105" y="770" text-anchor="end" class="cap">function</text><rect x="850" y="790" width="260" height="55" rx="4" fill="#FFFFB5" stroke="#5c5c5c"/><text x="980.0" y="809.0" text-anchor="middle" font-weight="400">A.10 Third-party and customer</text><text x="980.0" y="824.0" text-anchor="middle" font-weight="400">relationships</text><text x="1105" y="840" text-anchor="end" class="cap">function</text><rect x="850" y="860" width="260" height="55" rx="4" fill="#FFFFB5" stroke="#5c5c5c"/><text x="980.0" y="879.0" text-anchor="middle" font-weight="400">A.5 Assessing impacts of AI</text><text x="980.0" y="894.0" text-anchor="middle" font-weight="400">systems</text><text x="1105" y="910" text-anchor="end" class="cap">function</text><rect x="850" y="930" width="260" height="55" rx="4" fill="#FFFFB5" stroke="#5c5c5c"/><text x="980.0" y="956.5" text-anchor="middle" font-weight="400">A.2 Policies related to AI</text><text x="1105" y="980" text-anchor="end" class="cap">function</text><rect x="850" y="1000" width="260" height="55" rx="4" fill="#FFFFB5" stroke="#5c